[package]
name = "vocmeet-app"
version = "0.5.0"
edition = "2021"
description = "VocMeet 离线会议纪要"
default-run = "vocmeet-app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vocmeet-core = { path = "../crates/core" }
vocmeet-capture = { path = "../crates/capture" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
