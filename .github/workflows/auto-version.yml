name: Auto Version & Tag

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      bump:
        description: "版本递增类型"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: 计算版本号并打 tag
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 计算下一个版本号
        id: bump
        env:
          BUMP_INPUT: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail
          current=$(node -p "require('./package.json').version")
          IFS='.' read -r major minor patch <<< "$current"

          bump="$BUMP_INPUT"
          if [ -z "$bump" ]; then
            # 自动触发：按 Conventional Commits 扫描自上一个 tag 以来的提交
            last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            range=""
            [ -n "$last_tag" ] && range="$last_tag..HEAD"
            log=$(git log $range --pretty=%s || true)
            if echo "$log" | grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE'; then
              bump=major
            elif echo "$log" | grep -qE '^feat(\(.+\))?:'; then
              bump=minor
            else
              bump=patch
            fi
          fi

          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new_version="$major.$minor.$patch"
          echo "当前版本 $current → 新版本 $new_version（$bump）"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: 同步版本号到各处配置
        run: |
          set -euo pipefail
          v="${{ steps.bump.outputs.new_version }}"
          npm pkg set version="$v"
          sed -i "0,/^version = \".*\"/s//version = \"$v\"/" Cargo.toml
          sed -i "0,/^version = \".*\"/s//version = \"$v\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \".*\"/\"version\": \"$v\"/" src-tauri/tauri.conf.json

      - name: 提交并打 tag
        run: |
          set -euo pipefail
          v="${{ steps.bump.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json Cargo.toml src-tauri/Cargo.toml src-tauri/tauri.conf.json
          git commit -m "chore: bump version to v$v [skip ci]"
          git tag "v$v"
          git push origin HEAD:main
          git push origin "v$v"

      - name: 触发 release 构建
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${{ steps.bump.outputs.new_version }}"
          # tag push 用的是 GITHUB_TOKEN，不会自动触发其它工作流的 push 事件，
          # 所以这里显式 dispatch release.yml，用 tag 参数指定要构建哪个版本。
          gh workflow run release.yml --ref main -f "tag=v$v" --repo "${{ github.repository }}"
