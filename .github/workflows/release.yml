name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并发布的 tag（例如 v0.2.0）；留空则用触发时的 ref"
        required: false
        type: string

jobs:
  release:
    name: Build & Release (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Desktop Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 的 ad-hoc 签名由 src-tauri/tauri.conf.json 的 bundle.macOS.signingIdentity 兜底。
          # 以后拿到 Developer ID 证书要做正式签名 + 公证时，在这里加 APPLE_CERTIFICATE /
          # APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD /
          # APPLE_TEAM_ID 即可——环境变量优先级高于配置文件，会自动覆盖掉 ad-hoc。
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'VocMeet ${{ env.RELEASE_TAG }}'
          releaseBody: |
            ## VocMeet 声会 ${{ env.RELEASE_TAG }} 发布日志

            ### 安装说明
            - **macOS 首次打开**：安装包只做了 ad-hoc 签名、未经 Apple 公证，双击会提示「无法验证开发者」。
              把 VocMeet.app 拖进「应用程序」后，右键点图标选「打开」→ 再次确认「打开」即可；
              或在终端执行 `xattr -dr com.apple.quarantine /Applications/VocMeet.app` 一次性放行。
            - 首次安装运行后，请前往「设置」页点击「一键下载模型」以初始化离线语音识别与说话人分离权重。
            - 纪要生成推荐配合本地 Ollama (`ollama serve && ollama pull qwen2.5:7b`)。
            - macOS 版本暂未支持系统音频采集（见 README「已知限制」），可通过拖拽已有录音文件使用转写与纪要功能。

            ### 合规提示
            请遵守当地录音法律规范，开启录制前确保已取得全体参会人知情同意。详情参见项目 `DISCLAIMER.md`。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    name: 发布 Release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: 取消草稿，正式发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ env.RELEASE_TAG }}" --draft=false --repo "${{ github.repository }}"
