name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and Build
        run: npm run build

  rust-test:
    name: Rust Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      # sherpa-onnx-sys 的 build.rs 把下载好的静态库解到 target/sherpa-onnx-prebuilt/，
      # 这个目录不归 Cargo 管，rust-cache 存缓存前的清理会把里面的 .a/.lib 当垃圾扫掉，
      # 只留空目录——下次构建看到目录存在就当已经下载过，链接时就找不到库了。
      # 单独给这个目录上缓存：declare 在 rust-cache 之后，靠 post-step 反序执行，
      # 保证这里的 save 在 rust-cache 的清理之前跑，存下来的是完整文件。
      - name: Cache sherpa-onnx prebuilt libs
        id: sherpa-cache
        uses: actions/cache@v4
        with:
          path: target/sherpa-onnx-prebuilt
          key: sherpa-onnx-prebuilt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      # 没命中上面这层专门的缓存，说明 target/ 里现在这份是 rust-cache 清理后留下的
      # 空壳目录，得清掉逼 build.rs 重新下载，否则它会误以为已经装好，链接直接失败。
      - name: Purge stale sherpa-onnx dir on cache miss
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        shell: bash
        run: rm -rf target/sherpa-onnx-prebuilt

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cargo Check
        run: cargo check --workspace --tests

      - name: Cargo Test
        # 运行纯核心逻辑测试
        run: cargo test --workspace
